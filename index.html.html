        iconBg: 'bg-violet-600 text-white shadow-violet-500/25',
        bar: 'bg-violet-600 dark:bg-violet-500',
        btn: 'bg-violet-600 hover:bg-violet-700 active:bg-violet-800 text-white shadow-violet-500/20',
        accentText: 'text-violet-600 dark:text-violet-400',
        ring: 'ring-violet-500/30',
        borderTop: 'border-t-violet-500',
        pillActive: 'bg-violet-600 text-white border-violet-600'
      },
      amber: {
        badge: 'bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300',
        iconBg: 'bg-amber-500 text-white shadow-amber-500/25',
        bar: 'bg-amber-500 dark:bg-amber-400',
        btn: 'bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white shadow-amber-500/20',
        accentText: 'text-amber-600 dark:text-amber-400',
        ring: 'ring-amber-500/30',
        borderTop: 'border-t-amber-500',
        pillActive: 'bg-amber-600 text-white border-amber-600'
      }
    };

    const FONT_SCALES = [
      { label: 'Pequena', stem: 'text-sm sm:text-[15px]', opt: 'text-sm' },
      { label: 'Normal', stem: 'text-[15px] sm:text-base', opt: 'text-[14px] sm:text-[15px]' },
      { label: 'Média', stem: 'text-base sm:text-lg', opt: 'text-[15px] sm:text-base' },
      { label: 'Grande', stem: 'text-lg sm:text-xl', opt: 'text-base sm:text-lg' },
      { label: 'Extra', stem: 'text-xl sm:text-2xl', opt: 'text-lg sm:text-xl' }
    ];

    const STORAGE_KEY = 'direito_ead_mod2_banco_v1';
    const LETTERS = ['A', 'B', 'C', 'D', 'E'];

    /* ==========================================================================
       GERENCIAMENTO DE ESTADO E PERSISTÊNCIA
       ========================================================================== */
    function loadSavedState() {
      const defaults = {
        theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
        fontIndex: 1, // Normal
        answers: { civil: {}, constitucional: {}, filosofia: {}, metodologia: {} },
        bookmarks: { civil: {}, constitucional: {}, filosofia: {}, metodologia: {} },
        lastQuestion: { civil: 1, constitucional: 1, filosofia: 1, metodologia: 1 },
        shuffleQuestions: false,
        shuffleOptions: false
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaults;
        const parsed = JSON.parse(raw);
        return {
          ...defaults,
          ...parsed,
          answers: { ...defaults.answers, ...(parsed.answers || {}) },
          bookmarks: { ...defaults.bookmarks, ...(parsed.bookmarks || {}) },
          lastQuestion: { ...defaults.lastQuestion, ...(parsed.lastQuestion || {}) },
          fontIndex: typeof parsed.fontIndex === 'number'
            ? Math.max(0, Math.min(FONT_SCALES.length - 1, parsed.fontIndex))
            : defaults.fontIndex
        };
      } catch (e) {
        console.warn('Falha ao ler localStorage:', e);
        return defaults;
      }
    }

    let state = loadSavedState();

    // Estado de navegação em memória
    const ui = {
      view: 'home', // 'home' | 'study'
      subjectId: null,
      filter: 'all', // 'all' | 'unanswered' | 'wrong' | 'bookmarked'
      currentIndex: 0, // índice dentro da lista filtrada atual
      shuffledOrder: {}, // { [subjectId]: [num1, num2, ...] }
      shuffledOptOrder: {}, // { [subjectId]: { [num]: ['C','A','E','B','D'] } }
      completionShownFor: {} // evita reabrir o modal repetidamente na mesma sessão
    };

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Falha ao salvar no localStorage:', e);
      }
    }

    function applyTheme() {
      const root = document.documentElement;
      if (state.theme === 'dark') {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
    }

    /* ==========================================================================
       UTILITÁRIOS
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getSubject(id) {
      return SUBJECTS.find(s => s.id === id);
    }

    function getSubjectStats(subject) {
      const ans = state.answers[subject.id] || {};
      const bms = state.bookmarks[subject.id] || {};
      const total = subject.questions.length;
      let answered = 0;
      let correct = 0;
      let wrong = 0;
      let bookmarked = 0;

      for (const q of subject.questions) {
        if (bms[q.num]) bookmarked++;
        const selected = ans[q.num];
        if (selected) {
          answered++;
          if (selected === q.answer) correct++;
          else wrong++;
        }
      }
      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      const progress = Math.round((answered / total) * 100);
      return { total, answered, correct, wrong, bookmarked, accuracy, progress };
    }

    function getOverallStats() {
      let total = 0, answered = 0, correct = 0, wrong = 0;
      for (const s of SUBJECTS) {
        const st = getSubjectStats(s);
        total += st.total;
        answered += st.answered;
        correct += st.correct;
        wrong += st.wrong;
      }
      const accuracy = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      const progress = total > 0 ? Math.round((answered / total) * 100) : 0;
      return { total, answered, correct, wrong, accuracy, progress };
    }

    function ensureShuffledOrder(subjectId, forceNew = false) {
      const subject = getSubject(subjectId);
      if (!subject) return;
      if (!ui.shuffledOrder[subjectId] || forceNew) {
        ui.shuffledOrder[subjectId] = shuffleArray(subject.questions.map(q => q.num));
      }
    }

    function getOptionLettersForQuestion(subjectId, qNum) {
      if (!state.shuffleOptions) {
        return [...LETTERS];
      }
      if (!ui.shuffledOptOrder[subjectId]) {
        ui.shuffledOptOrder[subjectId] = {};
      }
      if (!ui.shuffledOptOrder[subjectId][qNum]) {
        ui.shuffledOptOrder[subjectId][qNum] = shuffleArray(LETTERS);
      }
      return ui.shuffledOptOrder[subjectId][qNum];
    }

    function getOrderedQuestions(subject) {
      if (!state.shuffleQuestions) {
        return subject.questions;
      }
      ensureShuffledOrder(subject.id, false);
      const map = new Map(subject.questions.map(q => [q.num, q]));
      return ui.shuffledOrder[subject.id].map(num => map.get(num)).filter(Boolean);
    }

    function getFilteredQuestions(subject) {
      const ordered = getOrderedQuestions(subject);
      const ans = state.answers[subject.id] || {};
      const bms = state.bookmarks[subject.id] || {};

      switch (ui.filter) {
        case 'unanswered':
          return ordered.filter(q => !ans[q.num]);
        case 'wrong':
          return ordered.filter(q => ans[q.num] && ans[q.num] !== q.answer);
        case 'bookmarked':
          return ordered.filter(q => !!bms[q.num]);
        default:
          return ordered;
      }
    }

    function showToast(message) {
      const el = document.getElementById('toast-root');
      el.innerHTML = `
        <div class="bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs sm:text-sm font-medium px-4 py-2.5 rounded-full shadow-lg whitespace-nowrap">
          ${escapeHtml(message)}
        </div>
      `;
      el.classList.remove('opacity-0', 'translate-y-2');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2100);
    }

    /* ==========================================================================
       FORMATAÇÃO INTELIGENTE DO ENUNCIADO
       Respeita quebras de linha, itens romanos (I, II...) e parênteses ( ) de V/F
       ========================================================================== */
    function formatStemHtml(stem) {
      const lines = stem.split('\n');
      return lines
        .map(raw => {
          const line = raw.trim();
          if (!line) return '<div class="h-2"></div>';
          const escaped = escapeHtml(line);
          const isListItem =
            /^\(\s*\)/.test(line) ||
            /^(I|II|III|IV|V|VI|VII|VIII|IX|X)\s*[-–.]/.test(line) ||
            /^[1-9]\.\s/.test(line);
          if (isListItem) {
            return `<p class="pl-3 border-l-2 border-slate-200 dark:border-slate-700 my-1.5 leading-relaxed">${escaped}</p>`;
          }
          return `<p class="my-1.5 leading-relaxed">${escaped}</p>`;
        })
        .join('');
    }

                  onclick="changeFontSize(1)"
                  ${canIncFont ? '' : 'disabled'}
                  aria-label="Aumentar fonte"
                  class="w-9 h-9 rounded-lg text-xs font-bold flex items-center justify-center transition-colors ${
                    canIncFont
                      ? 'text-slate-700 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-700'
                      : 'text-slate-300 dark:text-slate-600 cursor-not-allowed'
                  }">
                  A+
                </button>
              </div>
              <button
                type="button"
                onclick="toggleTheme()"
                aria-label="Alternar tema claro ou escuro"
                class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/70 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-amber-300 transition-colors">
                ${state.theme === 'dark' ? getIcon('sun', 'w-5 h-5') : getIcon('moon', 'w-5 h-5')}
              </button>
            </div>
          </div>
        </header>

        <!-- Conteúdo Principal Dashboard -->
        <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-8">
          <!-- Placar Geral -->
          <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-5 sm:p-6 mb-6 sm:mb-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Desempenho Geral
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                  Progresso salvo automaticamente neste dispositivo
                </p>
              </div>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">
                ${overall.progress}% concluído
              </span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
              <div class="rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-700/60 p-3.5">
                <div class="text-xs font-medium text-slate-500 dark:text-slate-400">Respondidas</div>
                <div class="text-2xl font-extrabold text-slate-900 dark:text-white mt-1">
                  ${overall.answered}<span class="text-sm font-semibold text-slate-400">/${overall.total}</span>
                </div>
              </div>
              <div class="rounded-xl bg-emerald-50/80 dark:bg-emerald-950/35 border border-emerald-200/70 dark:border-emerald-900/60 p-3.5">
                <div class="text-xs font-medium text-emerald-700 dark:text-emerald-300">Total Acertos</div>
                <div class="text-2xl font-extrabold text-emerald-700 dark:text-emerald-400 mt-1">
                  ${overall.correct}
                </div>
              </div>
              <div class="rounded-xl bg-rose-50/80 dark:bg-rose-950/35 border border-rose-200/70 dark:border-rose-900/60 p-3.5">
                <div class="text-xs font-medium text-rose-700 dark:text-rose-300">Total Erros</div>
                <div class="text-2xl font-extrabold text-rose-700 dark:text-rose-400 mt-1">
                  ${overall.wrong}
                </div>
              </div>
              <div class="rounded-xl bg-indigo-50/80 dark:bg-indigo-950/35 border border-indigo-200/70 dark:border-indigo-900/60 p-3.5">
                <div class="text-xs font-medium text-indigo-700 dark:text-indigo-300">Aproveitamento</div>
                <div class="text-2xl font-extrabold text-indigo-700 dark:text-indigo-400 mt-1">
                  ${overall.accuracy}%
                </div>
              </div>
            </div>

            <div class="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-indigo-600 via-teal-500 to-emerald-500 rounded-full transition-all duration-500" style="width: ${overall.progress}%"></div>
            </div>
          </section>

          <!-- Grade das 4 Matérias -->
          <section aria-label="Matérias disponíveis" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            ${cardsHtml}
          </section>

          <footer class="mt-10 pb-6 text-center text-xs text-slate-400 dark:text-slate-500">
            Banco de Questões — Direito EAD (Módulo 2) • Otimizado para iPad, iPhone, Android e Desktop
          </footer>
        </main>
      `;
    }

    /* ==========================================================================
       RENDERIZAÇÃO: TELA DE ESTUDO DA MATÉRIA
       ========================================================================== */
    function renderStudy() {
      const subject = getSubject(ui.subjectId);
      if (!subject) {
        ui.view = 'home';
        return renderHome();
      }

      const palette = COLOR_STYLES[subject.color];
      const st = getSubjectStats(subject);
      const list = getFilteredQuestions(subject);
      const scale = FONT_SCALES[state.fontIndex];

      // Garante índice válido dentro da lista filtrada
      if (list.length > 0) {
        if (ui.currentIndex < 0) ui.currentIndex = 0;
        if (ui.currentIndex >= list.length) ui.currentIndex = list.length - 1;
      } else {
        ui.currentIndex = 0;
      }

      const currentQ = list[ui.currentIndex] || null;
      const subjectAnswers = state.answers[subject.id] || {};
      const subjectBookmarks = state.bookmarks[subject.id] || {};

      // Contagens para os filtros
      const unansweredCount = st.total - st.answered;
      const filters = [
        { id: 'all', label: `Todas (${st.total})` },
        { id: 'unanswered', label: `Não respondidas (${unansweredCount})` },
        { id: 'wrong', label: `Erradas (${st.wrong})` },
        { id: 'bookmarked', label: `Marcadas ★ (${st.bookmarked})` }
      ];

      let mainContentHtml = '';

      if (!currentQ) {
        // Estado vazio do filtro
        const emptyMessages = {
          unanswered: 'Parabéns! Você já respondeu todas as questões desta matéria.',
          wrong: 'Excelente! Você não tem nenhuma questão errada para revisar no momento.',
          bookmarked: 'Você ainda não marcou nenhuma questão com estrela ★ nesta matéria.',
          all: 'Nenhuma questão encontrada.'
        };
        mainContentHtml = `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-8 sm:p-10 text-center shadow-sm animate-card">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 flex items-center justify-center mb-4">
              ${ui.filter === 'wrong' || ui.filter === 'unanswered' ? getIcon('trophy', 'w-7 h-7 text-emerald-500') : getIcon('starOutline', 'w-7 h-7')}
            </div>
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">
              Nenhuma questão neste filtro
            </h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto mb-6">
              ${emptyMessages[ui.filter] || emptyMessages.all}
            </p>
            <button
              type="button"
              onclick="setFilter('all')"
              class="min-h-[48px] px-5 py-3 rounded-xl font-semibold text-sm ${palette.btn} transition-all">
              Ver todas as questões
            </button>
          </div>
        `;
      } else {
        const selectedOriginal = subjectAnswers[currentQ.num] || null;
        const isAnswered = !!selectedOriginal;
        const isCorrect = selectedOriginal === currentQ.answer;
        const isBookmarked = !!subjectBookmarks[currentQ.num];
        const optionLetters = getOptionLettersForQuestion(subject.id, currentQ.num);

        // Descobre a letra visual correspondente à escolha e ao gabarito caso esteja embaralhado
        const visualLetters = LETTERS;
        const selectedVisualIdx = selectedOriginal ? optionLetters.indexOf(selectedOriginal) : -1;
        const selectedVisualLabel = selectedVisualIdx >= 0 ? visualLetters[selectedVisualIdx] : selectedOriginal;

        // Renderiza botões das alternativas
        const optionsHtml = optionLetters.map((origLetter, idx) => {
          const displayLetter = state.shuffleOptions ? visualLetters[idx] : origLetter;
          const optText = currentQ.options[origLetter];

          let btnClasses =
            'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700/80 hover:border-slate-400 dark:hover:border-slate-500 text-slate-800 dark:text-slate-100';
          let badgeClasses =
            'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700';
          let rightIcon = '';

          if (isAnswered) {
            if (origLetter === currentQ.answer) {
              // Alternativa CORRETA (sempre verde)
              btnClasses =
                'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 dark:border-emerald-500 text-emerald-950 dark:text-emerald-100 ring-2 ring-emerald-500/20';
              badgeClasses = 'bg-emerald-600 text-white border-emerald-600';
              rightIcon = `<span class="shrink-0 w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center">${getIcon('check', 'w-4 h-4')}</span>`;
            } else if (origLetter === selectedOriginal) {
              // Alternativa ERRADA clicada (vermelha)
              btnClasses =
                'bg-rose-50 dark:bg-rose-950/50 border-rose-500 dark:border-rose-500 text-rose-950 dark:text-rose-100 ring-2 ring-rose-500/20';
              badgeClasses = 'bg-rose-600 text-white border-rose-600';
              rightIcon = `<span class="shrink-0 w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center">${getIcon('x', 'w-4 h-4')}</span>`;
            } else {
              // Demais alternativas não escolhidas
              btnClasses =
                'bg-slate-50/70 dark:bg-slate-900/50 border-slate-200/60 dark:border-slate-800 text-slate-500 dark:text-slate-400 opacity-75';
              badgeClasses =
                'bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 border border-slate-200/70 dark:border-slate-700';
            }
          }

          const officialHint =
            isAnswered && state.shuffleOptions && (origLetter === currentQ.answer || origLetter === selectedOriginal)
              ? `<span class="inline-block ml-2 text-[11px] font-bold px-2 py-0.5 rounded-md bg-black/5 dark:bg-white/10">Oficial: ${origLetter}</span>`
              : '';

          return `
            <button
              type="button"
              ${isAnswered ? 'disabled' : `onclick="selectOption(${currentQ.num}, '${origLetter}')"`}
              class="w-full min-h-[56px] text-left rounded-2xl border-2 p-3.5 sm:p-4 transition-all duration-150 flex items-center gap-3.5 ${
                isAnswered ? 'cursor-default' : 'cursor-pointer active:scale-[0.99]'
              } ${btnClasses}">
              <span class="shrink-0 w-9 h-9 rounded-xl font-extrabold text-sm flex items-center justify-center transition-colors ${badgeClasses}">
                ${displayLetter}
              </span>
              <span class="flex-1 ${scale.opt} leading-snug font-medium">
                ${escapeHtml(optText)}${officialHint}
              </span>
              ${rightIcon}
            </button>
          `;
        }).join('');

        // Banner de Feedback Imediato
        let feedbackHtml = '';
        if (isAnswered) {
          if (isCorrect) {
            feedbackHtml = `
              <div class="mt-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border-2 border-emerald-500/80 p-4 flex items-start gap-3 text-emerald-900 dark:text-emerald-100 animate-card">
                <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center shrink-0 mt-0.5">
                  ${getIcon('check', 'w-5 h-5')}
                </div>
                <div class="text-sm sm:text-base font-semibold leading-snug">
                  ✓ Resposta Correta! <span class="font-extrabold">(Gabarito oficial: ${currentQ.answer})</span>
                </div>
              </div>
            `;
          } else {
            const markedText = state.shuffleOptions
              ? `alternativa ${selectedVisualLabel} (original ${selectedOriginal})`
              : selectedOriginal;
            feedbackHtml = `
              <div class="mt-5 rounded-2xl bg-rose-50 dark:bg-rose-950/50 border-2 border-rose-500/80 p-4 flex items-start gap-3 text-rose-900 dark:text-rose-100 animate-card">
                <div class="w-8 h-8 rounded-full bg-rose-600 text-white flex items-center justify-center shrink-0 mt-0.5">
                  ${getIcon('x', 'w-5 h-5')}
                </div>
                <div class="text-sm sm:text-base font-semibold leading-snug">
                  ✕ Resposta Incorreta! Você marcou <span class="font-extrabold">${markedText}</span> — o gabarito oficial é <span class="font-extrabold underline decoration-2">${currentQ.answer}</span>.
                </div>
              </div>
            `;
          }
        }

        const positionInFilter =
          ui.filter !== 'all' || state.shuffleQuestions
            ? `<span class="text-xs font-medium text-slate-400 dark:text-slate-500 ml-2">(${ui.currentIndex + 1}/${list.length} na lista)</span>`
            : '';

        mainContentHtml = `
          <article class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-5 sm:p-7 animate-card">
            <!-- Cabeçalho da Questão -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
              <div class="flex items-center flex-wrap">
                <span class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-extrabold px-3 py-1.5 rounded-xl ${palette.badge}">
                  Questão ${currentQ.num} de ${subject.questions.length}
                </span>
                ${positionInFilter}
              </div>

              <div class="flex items-center gap-2">
                ${
                  isAnswered
                    ? `<button
                        type="button"
                        onclick="redoQuestion(${currentQ.num})"
                        class="min-h-[40px] px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors flex items-center gap-1.5">
                        ${getIcon('refresh', 'w-3.5 h-3.5')}
                        <span>Refazer</span>
                      </button>`
                    : ''
                }
                <button
                  type="button"
                  onclick="toggleBookmark(${currentQ.num})"
                  aria-label="${isBookmarked ? 'Remover marcação para revisão' : 'Marcar questão para revisar'}"
                  class="min-h-[40px] px-3 py-1.5 rounded-xl text-xs font-semibold border transition-colors flex items-center gap-1.5 ${
                    isBookmarked
                      ? 'bg-amber-50 dark:bg-amber-950/50 border-amber-400 text-amber-700 dark:text-amber-300'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'
                  }">
                  ${isBookmarked ? getIcon('starSolid', 'w-4 h-4 text-amber-500') : getIcon('starOutline', 'w-4 h-4')}
                  <span class="hidden sm:inline">${isBookmarked ? 'Marcada' : 'Marcar'}</span>
                </button>
              </div>
            </div>

            <!-- Enunciado -->
            <div class="text-slate-800 dark:text-slate-100 font-medium ${scale.stem} mb-6">
              ${formatStemHtml(currentQ.stem)}
            </div>

            <!-- Alternativas -->
            <div class="space-y-3" role="radiogroup" aria-label="Alternativas da questão ${currentQ.num}">
              ${optionsHtml}
            </div>

            <!-- Feedback -->
            ${feedbackHtml}
          </article>
        `;
      }

      const canPrev = list.length > 0 && ui.currentIndex > 0;
      const canNext = list.length > 0 && ui.currentIndex < list.length - 1;

      return `
        <!-- Barra Superior Fixa -->
        <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 safe-top">
          <div class="max-w-4xl mx-auto px-3 sm:px-6 py-2.5 sm:py-3">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <button
                  type="button"
                  onclick="goHome()"
                  class="min-h-[42px] px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm flex items-center gap-1 shrink-0 transition-colors">
                  ${getIcon('arrowLeft', 'w-4 h-4')}
                  <span>Menu</span>
                </button>
                <div class="min-w-0">
                  <h1 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white truncate">
                    ${escapeHtml(subject.title)}
                  </h1>
                  <!-- Mini-placar ao vivo -->
                  <div class="flex items-center gap-2 text-[11px] sm:text-xs font-bold mt-0.5 flex-wrap">
                    <span class="text-emerald-600 dark:text-emerald-400">✓ ${st.correct}</span>
                    <span class="text-rose-600 dark:text-rose-400">✕ ${st.wrong}</span>
                    <span class="text-slate-500 dark:text-slate-400">${st.answered}/${st.total}</span>
                    <span class="px-1.5 py-0.2 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200">${st.accuracy}%</span>
                  </div>
                </div>
              </div>

              <!-- Controles rápidos do topo: Fonte, Tema, Mapa -->
              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onclick="openQuestionMap()"
                  class="min-h-[42px] px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs sm:text-sm flex items-center gap-1.5 transition-colors">
                  ${getIcon('grid', 'w-4 h-4')}
                  <span class="hidden sm:inline">Mapa</span>
                </button>
                <button
                  type="button"
                  onclick="toggleTheme()"
                  aria-label="Alternar tema"
                  class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-amber-300 transition-colors">
                  ${state.theme === 'dark' ? getIcon('sun', 'w-4 h-4') : getIcon('moon', 'w-4 h-4')}
                </button>
              </div>
            </div>

            <!-- Barra fina de progresso -->
            <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mt-2.5">
              <div class="h-full ${palette.bar} transition-all duration-300" style="width: ${st.progress}%"></div>
            </div>
          </div>
        </header>

        <!-- Barra de Filtros e Opções (compacta e deslizável no mobile) -->
        <div class="bg-slate-100/70 dark:bg-slate-900/50 border-b border-slate-200/70 dark:border-slate-800/80">
          <div class="max-w-4xl mx-auto px-3 sm:px-6 py-2.5 space-y-2">
            <!-- Linha 1: Filtros -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${filters
                .map(
                  f => `
                <button
                  type="button"
                  onclick="setFilter('${f.id}')"
                  class="shrink-0 min-h-[36px] px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all ${
                    ui.filter === f.id
                      ? palette.pillActive + ' shadow-sm'
                      : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'
                  }">
                  ${f.label}
                </button>
              `
                )
                .join('')}
            </div>

            <!-- Linha 2: Toggles, Fonte e Reiniciar -->
            <div class="flex items-center justify-between gap-2 overflow-x-auto no-scrollbar pt-0.5">
              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onclick="toggleShuffleQuestions()"
                  class="min-h-[34px] px-2.5 py-1 rounded-lg text-[11px] sm:text-xs font-semibold border flex items-center gap-1.5 transition-colors ${
                    state.shuffleQuestions
                      ? 'bg-indigo-100 dark:bg-indigo-950/70 border-indigo-400 text-indigo-800 dark:text-indigo-200'
                      : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                  }">
                  ${getIcon('shuffle', 'w-3.5 h-3.5')}
                  <span>Embaralhar Questões</span>
                </button>

                <button
                  type="button"
                  onclick="toggleShuffleOptions()"
                  class="min-h-[34px] px-2.5 py-1 rounded-lg text-[11px] sm:text-xs font-semibold border flex items-center gap-1.5 transition-colors ${
                    state.shuffleOptions
                      ? 'bg-indigo-100 dark:bg-indigo-950/70 border-indigo-400 text-indigo-800 dark:text-indigo-200'
                      : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                  }">
                  ${getIcon('shuffle', 'w-3.5 h-3.5')}
                  <span>Embaralhar Alternativas</span>
                </button>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <div class="inline-flex items-center rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 overflow-hidden">
                  <button
                    type="button"
                    onclick="changeFontSize(-1)"
                    class="px-2.5 h-[34px] text-[11px] font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
                    A-
                  </button>
                  <button
                    type="button"
                    onclick="changeFontSize(1)"
                    class="px-2.5 h-[34px] text-[11px] font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border-l border-slate-200 dark:border-slate-700">
                    A+
                  </button>
                </div>

                ${
                  st.answered === st.total
                    ? `<button
                        type="button"
                        onclick="openCompletionModal()"
                        class="min-h-[34px] px-2.5 py-1 rounded-lg text-[11px] sm:text-xs font-semibold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200 border border-emerald-300 dark:border-emerald-800 flex items-center gap-1">
                        ${getIcon('trophy', 'w-3.5 h-3.5')}
                        <span>Resumo</span>
                      </button>`
                    : ''
                }

                <button
                  type="button"
                  onclick="confirmResetSubject('${subject.id}')"
                  class="min-h-[34px] px-2.5 py-1 rounded-lg text-[11px] sm:text-xs font-semibold bg-white dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-slate-600 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-400 border border-slate-200 dark:border-slate-700 flex items-center gap-1 transition-colors">
                  ${getIcon('trash', 'w-3.5 h-3.5')}
                  <span>Reiniciar</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Corpo da Questão -->
        <main class="flex-1 max-w-4xl w-full mx-auto px-3 sm:px-6 pt-4 pb-28">
          ${
            subject.notice
              ? `<div class="mb-4 rounded-2xl bg-violet-50 dark:bg-violet-950/50 border border-violet-300/80 dark:border-violet-800 p-3.5 sm:p-4 flex items-start gap-3 text-violet-900 dark:text-violet-100 text-xs sm:text-sm">
                  <span class="shrink-0 mt-0.5 text-violet-600 dark:text-violet-300">${getIcon('alert', 'w-5 h-5')}</span>
                  <p class="leading-relaxed font-medium">${escapeHtml(subject.notice)}</p>
                </div>`
              : ''
          }
          ${mainContentHtml}
        </main>

        <!-- Rodapé Fixo de Navegação -->
        <footer class="fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200/80 dark:border-slate-800 safe-bottom">
          <div class="max-w-4xl mx-auto px-3 sm:px-6 pt-3 flex items-center justify-between gap-3">
            <button
              type="button"
              onclick="navigate(-1)"
              ${canPrev ? '' : 'disabled'}
              class="flex-1 min-h-[50px] px-4 py-3 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 border transition-all ${
                canPrev
                  ? 'bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 border-slate-300 dark:border-slate-700 active:scale-[0.98]'
                  : 'bg-slate-100 dark:bg-slate-900 text-slate-300 dark:text-slate-700 border-slate-200 dark:border-slate-800 cursor-not-allowed'
              }">
              ${getIcon('arrowLeft', 'w-5 h-5')}
              <span>Anterior</span>
            </button>

            <button
              type="button"
              onclick="openQuestionMap()"
              aria-label="Abrir mapa de questões"
              class="min-h-[50px] px-3.5 py-3 rounded-xl font-bold text-xs sm:text-sm bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shrink-0">
              ${currentQ ? `${ui.currentIndex + 1}/${list.length}` : '0/0'}
            </button>

            <button
              type="button"
              onclick="navigate(1)"
              ${canNext ? '' : 'disabled'}
              class="flex-1 min-h-[50px] px-4 py-3 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 shadow-sm transition-all ${
                canNext
                  ? palette.btn + ' active:scale-[0.98]'
                  : 'bg-slate-100 dark:bg-slate-900 text-slate-300 dark:text-slate-700 border border-slate-200 dark:border-slate-800 cursor-not-allowed shadow-none'
              }">
              <span>Próxima</span>
              ${getIcon('arrowRight', 'w-5 h-5')}
            </button>
          </div>
        </footer>
      `;
    }

    function render() {
      applyTheme();
      const appEl = document.getElementById('app');
      appEl.innerHTML = ui.view === 'study' ? renderStudy() : renderHome();
    }

    /* ==========================================================================
       AÇÕES E INTERAÇÕES
       ========================================================================== */
    function openSubject(subjectId) {
      ui.subjectId = subjectId;
      ui.view = 'study';
      ui.filter = 'all';
      if (state.shuffleQuestions) {
        ensureShuffledOrder(subjectId, false);
      }
      const subject = getSubject(subjectId);
      const list = getFilteredQuestions(subject);
      const lastNum = state.lastQuestion[subjectId] || 1;
      const idx = list.findIndex(q => q.num === lastNum);
      ui.currentIndex = idx >= 0 ? idx : 0;
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function goHome() {
      ui.view = 'home';
      closeModal();
      render();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function selectOption(qNum, origLetter) {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      if (!state.answers[subject.id]) state.answers[subject.id] = {};
      if (state.answers[subject.id][qNum]) return; // Já respondida

      state.answers[subject.id][qNum] = origLetter;
      state.lastQuestion[subject.id] = qNum;
      saveState();

      const st = getSubjectStats(subject);
      render();

      // Verifica se concluiu todas as questões da matéria
      if (st.answered === st.total && !ui.completionShownFor[subject.id]) {
        ui.completionShownFor[subject.id] = true;
        setTimeout(() => {
          if (ui.view === 'study' && ui.subjectId === subject.id) {
            openCompletionModal();
          }
        }, 550);
      }
    }

    function redoQuestion(qNum) {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      if (state.answers[subject.id] && state.answers[subject.id][qNum]) {
        delete state.answers[subject.id][qNum];
        delete ui.completionShownFor[subject.id];
        saveState();
        render();
        showToast(`Questão ${qNum} liberada para refazer.`);
      }
    }

    function toggleBookmark(qNum) {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      if (!state.bookmarks[subject.id]) state.bookmarks[subject.id] = {};
      if (state.bookmarks[subject.id][qNum]) {
        delete state.bookmarks[subject.id][qNum];
        showToast(`Marcação removida da Q${qNum}.`);
      } else {
        state.bookmarks[subject.id][qNum] = true;
        showToast(`Q${qNum} marcada para revisão ★`);
      }
      saveState();
      render();
    }

    function setFilter(filterId) {
      ui.filter = filterId;
      ui.currentIndex = 0;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigate(delta) {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      const list = getFilteredQuestions(subject);
      if (list.length === 0) return;

      const nextIdx = ui.currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < list.length) {
        ui.currentIndex = nextIdx;
        state.lastQuestion[subject.id] = list[ui.currentIndex].num;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function jumpToQuestion(qNum) {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      let list = getFilteredQuestions(subject);
      let idx = list.findIndex(q => q.num === qNum);

      // Se a questão clicada não está no filtro atual, volta para "Todas"
      if (idx === -1) {
        ui.filter = 'all';
        list = getFilteredQuestions(subject);
        idx = list.findIndex(q => q.num === qNum);
      }

      if (idx >= 0) {
        ui.currentIndex = idx;
        state.lastQuestion[subject.id] = qNum;
        saveState();
      }
      closeModal();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleShuffleQuestions() {
      state.shuffleQuestions = !state.shuffleQuestions;
      if (state.shuffleQuestions && ui.subjectId) {
        ensureShuffledOrder(ui.subjectId, true);
      }
      ui.currentIndex = 0;
      saveState();
      render();
      showToast(state.shuffleQuestions ? 'Ordem das questões embaralhada.' : 'Ordem original das questões restaurada.');
    }

    function toggleShuffleOptions() {
      state.shuffleOptions = !state.shuffleOptions;
      if (state.shuffleOptions) {
        ui.shuffledOptOrder = {};
      }
      saveState();
      render();
      showToast(
        state.shuffleOptions
          ? 'Alternativas embaralhadas (gabarito oficial preservado).'
          : 'Ordem oficial das alternativas (A–E) restaurada.'
      );
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      render();
    }

    function changeFontSize(delta) {
      const next = Math.max(0, Math.min(FONT_SCALES.length - 1, state.fontIndex + delta));
      if (next !== state.fontIndex) {
        state.fontIndex = next;
        saveState();
        render();
        showToast(`Tamanho da fonte: ${FONT_SCALES[state.fontIndex].label}`);
      }
    }

    /* ==========================================================================
       MODAIS (MAPA DE QUESTÕES, CONCLUSÃO E CONFIRMAÇÃO — SEM alert/confirm)
       ========================================================================== */
    function openModal(html) {
      const root = document.getElementById('modal-root');
      root.innerHTML = html;
      root.classList.remove('hidden');
      root.classList.add('flex');
      document.body.classList.add('overflow-hidden');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
      document.body.classList.remove('overflow-hidden');
    }

    // Fechar ao clicar fora do conteúdo do modal
    document.getElementById('modal-root').addEventListener('click', e => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function openQuestionMap() {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      const ans = state.answers[subject.id] || {};
      const bms = state.bookmarks[subject.id] || {};
      const list = getFilteredQuestions(subject);
      const activeQNum = list[ui.currentIndex] ? list[ui.currentIndex].num : null;

      const gridHtml = subject.questions
        .map(q => {
          const sel = ans[q.num];
          const isCurrent = q.num === activeQNum;
          const isMarked = !!bms[q.num];

          let tileClasses =
            'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700';
          if (sel) {
            if (sel === q.answer) {
              tileClasses =
                'bg-emerald-500 text-white border-emerald-600 hover:bg-emerald-600';
            } else {
              tileClasses =
                'bg-rose-500 text-white border-rose-600 hover:bg-rose-600';
            }
          }
          const currentRing = isCurrent
            ? 'ring-3 ring-blue-500 ring-offset-2 ring-offset-white dark:ring-offset-slate-900 border-blue-600 scale-105 z-10'
            : '';

          return `
            <button
              type="button"
              onclick="jumpToQuestion(${q.num})"
              class="relative h-12 rounded-xl font-bold text-sm border transition-all flex items-center justify-center ${tileClasses} ${currentRing}">
              <span>${q.num}</span>
              ${
                isMarked
                  ? `<span class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-amber-400 text-amber-950 flex items-center justify-center shadow-sm">${getIcon('starSolid', 'w-3 h-3')}</span>`
                  : ''
              }
            </button>
          `;
        })
        .join('');

      openModal(`
        <div class="bg-white dark:bg-slate-900 w-full max-w-xl max-h-[85vh] rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col overflow-hidden animate-modal">
          <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
            <div>
              <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">
                Mapa de Questões
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                ${escapeHtml(subject.title)} • Toque em um número para ir direto
              </p>
            </div>
            <button
              type="button"
              onclick="closeModal()"
              aria-label="Fechar mapa"
              class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center">
              ${getIcon('x', 'w-5 h-5')}
            </button>
          </div>

          <!-- Legenda -->
          <div class="px-5 py-3 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-200/70 dark:border-slate-800 flex flex-wrap items-center gap-3 text-xs font-semibold text-slate-600 dark:text-slate-300">
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-500"></span>Acertou</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-rose-500"></span>Errou</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-slate-300 dark:bg-slate-700"></span>Pendente</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded border-2 border-blue-500"></span>Atual</span>
            <span class="inline-flex items-center gap-1.5 text-amber-600 dark:text-amber-400">★ Marcada</span>
          </div>

          <!-- Grade de números -->
          <div class="p-5 overflow-y-auto grid grid-cols-5 sm:grid-cols-8 gap-2.5">
            ${gridHtml}
          </div>
        </div>
      `);
    }

    function openCompletionModal() {
      const subject = getSubject(ui.subjectId);
      if (!subject) return;
      const st = getSubjectStats(subject);
      const nota = ((st.correct / st.total) * 10).toFixed(1).replace('.', ',');
      const palette = COLOR_STYLES[subject.color];

      const circumference = 2 * Math.PI * 44;
      const offset = circumference - (st.accuracy / 100) * circumference;
      const strokeColor = st.accuracy >= 70 ? '#10b981' : st.accuracy >= 50 ? '#f59e0b' : '#f43f5e';

      const msg =
        st.accuracy === 100
          ? 'Desempenho impecável! Você gabaritou esta matéria!'
          : st.accuracy >= 70
          ? 'Ótimo resultado! Você dominou a maior parte do conteúdo.'
          : 'Bom treino! Revise as questões erradas para fixar os detalhes.';

      openModal(`
        <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 sm:p-7 text-center animate-modal">
          <div class="inline-flex items-center gap-1.5 text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full ${palette.badge} mb-3">
            ${getIcon('trophy', 'w-4 h-4')}
            <span>Matéria Concluída</span>
          </div>

          <h3 class="text-xl font-extrabold text-slate-900 dark:text-white mb-1">
            ${escapeHtml(subject.title)}
          </h3>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">
            ${msg}
          </p>

          <!-- Gráfico Circular -->
          <div class="relative w-32 h-32 mx-auto mb-5 flex items-center justify-center">
            <svg class="w-32 h-32 -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="9" class="text-slate-100 dark:text-slate-800"></circle>
              <circle cx="50" cy="50" r="44" fill="none" stroke="${strokeColor}" stroke-width="9" stroke-linecap="round"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-2xl font-extrabold text-slate-900 dark:text-white">${st.accuracy}%</span>
              <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400">Nota ${nota}</span>
            </div>
          </div>

          <!-- Resumo Numérico -->
          <div class="grid grid-cols-3 gap-2.5 mb-6">
            <div class="rounded-2xl bg-slate-50 dark:bg-slate-800 p-3">
              <div class="text-lg font-extrabold text-slate-900 dark:text-white">${st.total}</div>
              <div class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Questões</div>
            </div>
            <div class="rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 p-3">
              <div class="text-lg font-extrabold text-emerald-600 dark:text-emerald-400">${st.correct}</div>
              <div class="text-[11px] font-semibold text-emerald-700/80 dark:text-emerald-300/80">Acertos</div>
            </div>
            <div class="rounded-2xl bg-rose-50 dark:bg-rose-950/40 p-3">
              <div class="text-lg font-extrabold text-rose-600 dark:text-rose-400">${st.wrong}</div>
              <div class="text-[11px] font-semibold text-rose-700/80 dark:text-rose-300/80">Erros</div>
            </div>
          </div>

          <div class="space-y-2.5">
            ${
              st.wrong > 0
                ? `<button
                    type="button"
                    onclick="reviewWrongFromModal()"
                    class="w-full min-h-[48px] px-4 py-3 rounded-xl font-bold text-sm bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition-all">
                    Revisar apenas as erradas (${st.wrong})
                  </button>`
                : ''
            }
            <button
              type="button"
              onclick="goHome()"
              class="w-full min-h-[48px] px-4 py-3 rounded-xl font-bold text-sm ${palette.btn} transition-all">
              Voltar ao Menu Inicial
            </button>
            <button
              type="button"
              onclick="closeModal()"
              class="w-full min-h-[44px] px-4 py-2.5 rounded-xl font-semibold text-xs text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              Continuar nesta tela
            </button>
          </div>
        </div>
      `);
    }

    function reviewWrongFromModal() {
      closeModal();
      setFilter('wrong');
    }

    function confirmResetSubject(subjectId) {
      const subject = getSubject(subjectId);
      if (!subject) return;
      openModal(`
        <div class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 text-center animate-modal">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center mb-4">
            ${getIcon('trash', 'w-6 h-6')}
          </div>
          <h3 class="text-lg font-extrabold text-slate-900 dark:text-white mb-2">
            Reiniciar matéria?
          </h3>
          <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
            Todas as suas respostas e o placar de <strong class="text-slate-800 dark:text-slate-200">${escapeHtml(subject.title)}</strong> serão apagados. As demais matérias continuarão intactas.
          </p>
          <div class="flex items-center gap-2.5">
            <button
              type="button"
              onclick="closeModal()"
              class="flex-1 min-h-[46px] px-4 py-2.5 rounded-xl font-semibold text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors">
              Cancelar
            </button>
            <button
              type="button"
              onclick="executeResetSubject('${subject.id}')"
              class="flex-1 min-h-[46px] px-4 py-2.5 rounded-xl font-bold text-sm bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition-colors">
              Sim, zerar
            </button>
          </div>
        </div>
      `);
    }

    function executeResetSubject(subjectId) {
      state.answers[subjectId] = {};
      state.lastQuestion[subjectId] = 1;
      delete ui.completionShownFor[subjectId];
      if (ui.subjectId === subjectId) {
        ui.filter = 'all';
        ui.currentIndex = 0;
      }
      saveState();
      closeModal();
      render();
      const subject = getSubject(subjectId);
      showToast(`Progresso de ${subject ? subject.shortTitle : 'matéria'} zerado.`);
    }

    /* ==========================================================================
       ATALHOS DE TECLADO (Desktop e iPad com teclado)
       ========================================================================== */
    document.addEventListener('keydown', e => {
      const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
      if (e.key === 'Escape' && modalOpen) {
        closeModal();
        return;
      }
      if (ui.view !== 'study' || modalOpen) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigate(-1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigate(1);
      } else {
        const keyUpper = e.key.toUpperCase();
        const idx = LETTERS.indexOf(keyUpper);
        if (idx >= 0 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          const subject = getSubject(ui.subjectId);
          if (!subject) return;
          const list = getFilteredQuestions(subject);
          const currentQ = list[ui.currentIndex];
          if (!currentQ) return;
          if (state.answers[subject.id] && state.answers[subject.id][currentQ.num]) return;
          const optionLetters = getOptionLettersForQuestion(subject.id, currentQ.num);
          const origLetter = optionLetters[idx];
          if (origLetter) selectOption(currentQ.num, origLetter);
        }
      }
    });

    /* ==========================================================================
       INICIALIZAÇÃO
       ========================================================================== */
    render();
  </script>
</body>
</html>
